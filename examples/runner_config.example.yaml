preset: balanced
template_search_sequence:
  enabled: false
  binary: mmseqs
  database_path: /path/to/rcsb/mmseqs/protein_db
  min_seq_identity: 0.3
  min_coverage: 0.7
  sensitivity: 7.5
  max_hits: 200
  threads: 8
  extra_args: []
template_search_structure:
  enabled: false
  binary: foldseek
  database_path: /path/to/rcsb/foldseek/structure_db
  query_structure_path: /path/to/query_structure.cif
  query_from_cofolding: false
  query_model_priority:
    - alphafold3
    - boltz
    - protenix
  sensitivity: 9.5
  max_hits: 200
  alignment_type: 1
  threads: 8
  extra_args: []
boltz:
  enabled: true
  binary: .venvs/boltz/bin/boltz
  model: boltz2
  accelerator: gpu
  devices: 1
  cache: null
  checkpoint: null
  affinity_checkpoint: null
  use_msa_server: false
  recycling_steps: 3
  sampling_steps: 200
  diffusion_samples: 1
  max_parallel_samples: 5
  step_scale: null
  output_format: mmcif
  num_workers: 2
  override: false
  msa_server_url: https://api.colabfold.com
  msa_pairing_strategy: greedy
  msa_server_username: null
  msa_server_password: null
  api_key_header: null
  api_key_value: null
  use_potentials: false
  method: null
  preprocessing_threads: null
  affinity_mw_correction: false
  sampling_steps_affinity: 200
  diffusion_samples_affinity: 5
  max_msa_seqs: 8192
  subsample_msa: true
  num_subsampled_msa: 1024
  no_kernels: false
  write_full_pae: false
  write_full_pde: false
  write_embeddings: false
  extra_args: []
protenix:
  enabled: true
  binary: .venvs/protenix/bin/protenix
  model_name: protenix_base_default_v1.0.0
  cycle: 10
  step: 200
  sample: 5
  dtype: bf16
  use_msa: false
  use_default_params: false
  trimul_kernel: cuequivariance
  triatt_kernel: cuequivariance
  enable_cache: true
  enable_fusion: true
  enable_tf32: true
  msa_server_mode: protenix
  use_template: false
  use_rna_msa: false
  use_seeds_in_json: false
  need_atom_confidence: false
  kalign_binary_path: null
  hmmsearch_binary_path: null
  hmmbuild_binary_path: null
  seqres_database_path: null
  nhmmer_binary_path: null
  hmmalign_binary_path: null
  hmmbuild_rna_binary_path: null
  ntrna_database_path: null
  rfam_database_path: null
  rna_central_database_path: null
  nhmmer_n_cpu: null
  extra_args: []
alphafold3:
  enabled: true
  python_bin: .venvs/alphafold3/bin/python
  script: external/alphafold3/run_alphafold.py
  model_dir: /path/to/alphafold3/models
  db_dirs:
    - /path/to/alphafold3/databases
  run_data_pipeline: false
  run_inference: true
  jackhmmer_binary_path: null
  nhmmer_binary_path: null
  hmmalign_binary_path: null
  hmmsearch_binary_path: null
  hmmbuild_binary_path: null
  jackhmmer_n_cpu: 8
  jackhmmer_max_parallel_shards: null
  nhmmer_n_cpu: 8
  nhmmer_max_parallel_shards: null
  resolve_msa_overlaps: null
  max_template_date: null
  conformer_max_iterations: null
  jax_compilation_cache_dir: null
  gpu_device: 0
  buckets: []
  flash_attention_implementation: triton
  num_recycles: 10
  num_diffusion_samples: 5
  num_seeds: null
  save_embeddings: false
  save_distogram: false
  force_output_dir: false
  compress_large_output_files: false
  extra_args: []
vina:
  enabled: false
  binary: vina
  receptor_pdbqt: /path/to/receptor.pdbqt
  ligand_pdbqt: /path/to/ligand.pdbqt
  center_x: 0.0
  center_y: 0.0
  center_z: 0.0
  size_x: 20.0
  size_y: 20.0
  size_z: 20.0
  cpu: 8
  exhaustiveness: 16
  num_modes: 20
  energy_range: 4.0
  scoring: vina
  seed: null
  extra_args: []
slurm:
  account: null
  partition: gpu
  gpus: 1
  cpus_per_task: 8
  mem: 64G
  time: 04:00:00
  extra_sbatch_args: []
