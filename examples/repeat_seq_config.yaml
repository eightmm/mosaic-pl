preset: balanced
boltz:
  enabled: true
  binary: .venvs/boltz/bin/boltz
  model: boltz2
  accelerator: gpu
  devices: 1
  use_msa_server: false
  recycling_steps: 3
  sampling_steps: 200
  diffusion_samples: 1
  max_parallel_samples: 5
  output_format: mmcif
  num_workers: 2
  override: true
  no_kernels: false
  extra_args: []
protenix:
  enabled: true
  binary: .venvs/protenix/bin/protenix
  model_name: protenix-v2
  cycle: 10
  step: 200
  sample: 5
  dtype: bf16
  use_msa: false
  use_default_params: false
  trimul_kernel: cuequivariance
  triatt_kernel: cuequivariance
  enable_cache: true
  enable_fusion: true
  enable_tf32: true
  extra_args: []
alphafold3:
  enabled: false
vina:
  enabled: false
template_search_sequence:
  enabled: false
template_search_structure:
  enabled: false
slurm:
  partition: 6000ada
  gpus: 1
  mem: 64G
  time: 04:00:00
  extra_sbatch_args: []
