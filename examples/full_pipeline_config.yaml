preset: fast
template_search_sequence:
  enabled: true
  binary: .local/bin/mmseqs
  database_path: data/search_dbs/sequence/rcsb_seqDB
  min_seq_identity: 0.3
  min_coverage: 0.7
  sensitivity: 7.5
  max_hits: 200
  threads: 8
  extra_args: []
template_search_structure:
  enabled: false
boltz:
  enabled: true
  binary: .venvs/boltz/bin/boltz
  model: boltz2
  accelerator: gpu
  devices: 1
  use_msa_server: false
  override: true
  no_kernels: false
  extra_args: []
protenix:
  enabled: true
  binary: .venvs/protenix/bin/protenix
  model_name: protenix-v2
  dtype: bf16
  trimul_kernel: cuequivariance
  triatt_kernel: cuequivariance
  use_tfg_guidance: false
  extra_args: []
alphafold3:
  enabled: false
vina:
  enabled: true
autodock_gpu:
  enabled: true
protenix_dock:
  enabled: true
slurm:
  partition: 6000ada
  gpus: 1
  mem: 64G
  time: 06:00:00
  extra_sbatch_args: []
