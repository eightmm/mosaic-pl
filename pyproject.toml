[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "casp17-protein-ligand-hub"
version = "0.1.0"
description = "Unified uv-based workspace for CASP17 protein-ligand skill and MCP development."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
mcp = [
  "mcp>=1.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.8.0",
]

[project.scripts]
casp17-pl = "casp17_pl_hub.cli:main"
casp17-pl-mcp = "casp17_pl_hub.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/casp17_pl_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
