preset: balanced

# Multi-seed ensemble: 5 seeds x 5 samples = 25 structures per cofolding model
cofolding_seeds: [42, 101, 202, 303, 404]
docking_seeds: [42, 101, 202, 303, 404]

template_search_sequence:
  enabled: true
  binary: .local/bin/mmseqs
  database_path: data/search_dbs/sequence/rcsb_seqDB
  min_seq_identity: 0.3
  min_coverage: 0.7
  sensitivity: 7.5
  max_hits: 500
  threads: 8
  rcsb_dir: ~/DB/RCSB/raw/mmCIF_data
  rcsb_db_path: ~/DB/RCSB/processed/rcsb_index.db
  mcs_threshold: 0.5
  # Time-split benchmark: drop any template hit with deposition date
  # on or after this cutoff so 2025 novel structures can't leak in.
  max_deposition_date: "2025-01-01"

template_search_structure:
  enabled: true
  binary: .local/bin/foldseek
  database_path: data/search_dbs/structure/rcsb_structDB
  query_from_cofolding: true
  query_model_priority: [alphafold3, boltz2x, boltz2, protenix]
  sensitivity: 9.5
  max_hits: 2000
  alignment_type: 1
  threads: 8
  # Foldseek's *estimated* qtmscore is left as a sort hint only — the
  # authoritative same-fold gate is USalign's actual TM-score, applied
  # by ``extract_template_pockets --min-tmscore`` (default 0.5). Setting
  # this > 0 here would only filter ``filtered_hits.tsv`` for inspection.
  qtmscore_min: 0.0

boltz:
  enabled: true
  binary: .venvs/boltz/bin/boltz
  model: boltz2
  accelerator: gpu
  devices: 1
  use_msa_server: true
  override: true
  no_kernels: false
  use_potentials: true
  diffusion_samples: 5
  recycling_steps: 3
  sampling_steps: 200
  extra_args: []

protenix:
  enabled: true
  binary: .venvs/protenix/bin/protenix
  model_name: protenix_base_default_v1.0.0
  kalign_binary_path: .local/bin/kalign
  use_msa: true              # Protenix fetches its own MSA (msa_server_mode: protenix)
  dtype: bf16
  trimul_kernel: cuequivariance
  triatt_kernel: cuequivariance
  use_tfg_guidance: false
  sample: 5
  cycle: 10
  step: 200
  extra_args: []

alphafold3:
  enabled: true
  python_bin: .venvs/alphafold3/bin/python
  script: external/alphafold3/run_alphafold.py
  model_dir: external/alphafold3/models
  run_data_pipeline: false
  run_inference: true
  num_seeds: 5
  num_diffusion_samples: 5

vina:
  enabled: true
  exhaustiveness: 32
  num_modes: 10

autodock_gpu:
  enabled: true
  nrun: 100

protenix_dock:
  enabled: true

post_analysis:
  enabled: true
  device: cuda

submission:
  enabled: true
  author: "0000-0000-0000"
  method: "Boltz-2x + Multi-track ensemble + lig-align (5 seeds x 5 samples) [time-split 2025]"
  include_affinity: true
  parent: "N/A"
  ligand_number: 1

slurm:
  partition: 6000ada
  gpus: 1
  mem: 96G
  time: 12:00:00
  extra_sbatch_args: []

# Unified MSA pipeline — runs AF3's data pipeline (jackhmmer + hmmsearch)
# once per target and feeds the output to all three cofolding tools.
# Replaces the per-tool ColabFold round-trip. CPU-heavy (~30-90 min/target).
msa_pipeline:
  enabled: true
  db_dir: /home/jaemin/DB/AlphaFold3
  jackhmmer_binary_path: .local/bin/jackhmmer
  hmmsearch_binary_path: .local/bin/hmmsearch
  hmmbuild_binary_path: .local/bin/hmmbuild
  nhmmer_binary_path: .local/bin/nhmmer
  hmmalign_binary_path: .local/bin/hmmalign
  max_template_date: "2025-01-01"
  n_cpu: 8
  max_templates: 4
